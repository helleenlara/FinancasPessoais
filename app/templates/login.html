<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — MinhasFinanças</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1a1f36; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border: none; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
    .btn-primary { background: #4361ee; border-color: #4361ee; }
    .logo { font-size: 2rem; font-weight: 700; color: #4361ee; }
  </style>
</head>
<body>
<div class="card p-4" style="width: 100%; max-width: 400px;">
  <div class="text-center mb-4">
    <div class="logo"><i class="bi bi-wallet2"></i></div>
    <h4 class="fw-bold mt-2">MinhasFinanças</h4>
    <p class="text-muted small">Faça login para continuar</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">E-mail</label>
      <input type="email" name="email" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Senha</label>
      <input type="password" name="senha" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Entrar</button>
  </form>
  <p class="text-center mt-3 small">Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
